name: Integrate company news

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject board helper scripts
        shell: python
        run: |
          from pathlib import Path
          p = Path('asd.html')
          text = p.read_text(encoding='utf-8')

          news_old = '<script src="./company-news.js?v=1"></script>'
          news_new = '<script src="./company-news.js?v=2"></script>'
          pwa_marker = '<script src="./pwa-install.js?v=1"></script>'

          if news_old in text:
              text = text.replace(news_old, news_new, 1)
          elif news_new not in text and '</body>' in text:
              text = text.replace('</body>', news_new + '\n</body>', 1)

          if pwa_marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Could not find </body> in asd.html')
              text = text.replace(needle, pwa_marker + '\n' + needle, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit integration if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git add asd.html
          git commit -m "Add PWA install and price notifications"
          git push
