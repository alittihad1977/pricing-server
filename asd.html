<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    direction:rtl;
    color:white;
    background:#0b1b3d;
    overflow:hidden;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:96%;
    height:96%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.header{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:12px;
}

.header img{
    height:90px;
    max-height:15vh;
    width:auto;
    filter:drop-shadow(0 0 20px #f4c430);
}

.header h1{
    font-size:3.5rem;
    color:gold;
    margin:0;
}


/* الوقت والتاريخ */

.date-time{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-right:15px;
    min-width:180px;
}

.time{
    font-size:2rem;
    font-weight:bold;
    color:gold;
    direction:ltr;
    line-height:1.1;
}

.date{
    font-size:1.1rem;
    color:white;
    font-weight:bold;
    margin-top:5px;
}


table{
    width:100%;
    height:auto;
    border-collapse:separate;
    border-spacing:0 8px;
}

th, td{
    padding:12px;
    text-align:center;
    border-radius:12px;
}

th{
    background:linear-gradient(90deg,#1f3c88,#0d6efd);
    color:white;
    font-size:2rem;
}

td{
    background:white;
    color:#0b1b3d;
    font-weight:bold;
}

.price-cell{
    font-size:3rem;
    border:3px solid gold;
    border-radius:12px;
    padding:8px;
    background:white;
    color:#0b1b3d;
}

.flag-svg{
    width:55px;
    height:32px;
    filter:drop-shadow(0 0 7px rgba(255,255,255,0.35));
}

.up{
    color:#00e676;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:upMove 1s ease-in-out infinite;
}

.down{
    color:#ff3d00;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:downMove 1s ease-in-out infinite;
}

@keyframes upMove{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }
}

@keyframes downMove{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(0);
    }
}

.flash{
    animation:flashAnim 0.4s ease;
}

@keyframes flashAnim{
    0%{
        background:rgba(255,255,255,0.1);
    }

    100%{
        background:transparent;
    }
}

#updateSystem{
    display:none;
}


/* =====================================================
   شريط الأخبار
   ===================================================== */

.news-bar{

    position:fixed;

    bottom:5px;
    left:2%;

    width:96%;
    height:30px;

    display:flex;
    align-items:center;

    background:rgba(255,255,255,0.055);

    border:1px solid rgba(244,196,48,0.30);

    border-radius:9px;

    overflow:hidden;

    z-index:1000;

    direction:ltr;

}

.news-title{

    flex:0 0 auto;

    height:100%;

    padding:0 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(244,196,48,0.10);

    color:gold;

    font-size:0.85rem;

    font-weight:bold;

    direction:rtl;

}

.news-content{

    flex:1;

    height:100%;

    overflow:hidden;

    position:relative;

}

.news-track{

    position:absolute;

    white-space:nowrap;

    color:white;

    font-size:0.85rem;

    font-weight:bold;

    line-height:30px;

    animation:newsMove 55s linear infinite;

    direction:rtl;

}

.news-item{

    display:inline-block;

    margin-left:60px;

}

@keyframes newsMove{

    from{

        transform:translateX(0);

    }

    to{

        transform:translateX(100%);

    }

}


/* =====================================================
   الشاشات الكبيرة
   ===================================================== */

@media screen and (min-width:1400px){

    .container{
        width:97%;
        height:97%;
    }

    .header{
        margin-bottom:15px;
    }

    .header img{
        height:110px;
    }

    .header h1{
        font-size:4rem;
    }

    .date-time{
        min-width:220px;
    }

    .time{
        font-size:2.5rem;
    }

    .date{
        font-size:1.3rem;
    }

    th{
        font-size:2.4rem;
        padding:16px;
    }

    td{
        padding:14px;
    }

    .price-cell{
        font-size:3.5rem;
        padding:10px;
    }

    .flag-svg{
        width:65px;
        height:38px;
    }

}


/* =====================================================
   الشاشات الصغيرة
   ===================================================== */

@media screen and (max-width:900px){

    .container{
        width:95%;
    }

    .header img{
        height:70px;
    }

    .header h1{
        font-size:2.5rem;
    }

    .date-time{
        min-width:120px;
        margin-right:5px;
    }

    .time{
        font-size:1.4rem;
    }

    .date{
        font-size:0.8rem;
        margin-top:3px;
    }

    th{
        font-size:1.5rem;
        padding:8px;
    }

    td{
        padding:7px;
    }

    .price-cell{
        font-size:2rem;
        padding:6px;
    }

    .flag-svg{
        width:45px;
        height:27px;
    }

    .up,
    .down{
        font-size:1.8rem;
    }


    /* شريط الأخبار على الموبايل */

    .news-bar{

        bottom:3px;

        left:2.5%;

        width:95%;

        height:25px;

    }

    .news-title{

        padding:0 7px;

        font-size:0.70rem;

    }

    .news-track{

        font-size:0.70rem;

        line-height:25px;

    }

}


/* =====================================================
   نظام التحديث
   ===================================================== */

</style>
</head>

<script>


/* =====================================================
   الساعة والتاريخ
   ===================================================== */

function updateDateTime(){

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            'ar-SY',
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit',
                hour12:false
            }
        );

    const date =
        now.toLocaleDateString(
            'ar-SY',
            {
                weekday:'long',
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        );

    document.getElementById("liveTime").textContent = time;

    document.getElementById("liveDate").textContent = date;

}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);


/* =====================================================
   نظام الأسعار
   ===================================================== */

let oldPrices = {};
let direction = {};

let audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

let unlocked = false;


document.addEventListener(
    "click",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


document.addEventListener(
    "touchstart",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


function playSound(){

    if(!unlocked) return;

    let o =
        audioCtx.createOscillator();

    let g =
        audioCtx.createGain();

    o.type = "sine";

    o.frequency.value = 880;

    g.gain.value = 0.15;

    o.connect(g);

    g.connect(
        audioCtx.destination
    );

    o.start();

    o.stop(
        audioCtx.currentTime + 0.12
    );

}


function updateCell(id,value){

    let el =
        document.getElementById(id);

    if(!el) return;


    if(oldPrices[id] !== undefined){

        if(
            Number(value) !==
            Number(oldPrices[id])
        ){

            if(
                Number(value) >
                Number(oldPrices[id])
            ){

                direction[id] = "up";

            }else{

                direction[id] = "down";

            }


            document.body.classList.add(
                "flash"
            );


            setTimeout(
                function(){

                    document.body.classList.remove(
                        "flash"
                    );

                },
                300
            );


            playSound();

        }

    }


    oldPrices[id] = value;


    let arrow = "";


    if(direction[id] === "up"){

        arrow =
            "<span class='up'>▲</span>";

    }


    if(direction[id] === "down"){

        arrow =
            "<span class='down'>▼</span>";

    }


    el.innerHTML =
        value + arrow;

}


function updatePrices(){

    for(
        let i=1;
        i<=5;
        i++
    ){

        let buy =
            localStorage.getItem(
                "buy"+i
            );

        let sell =
            localStorage.getItem(
                "sell"+i
            );


        if(buy !== null){

            updateCell(
                "buy"+i,
                buy
            );

        }


        if(sell !== null){

            updateCell(
                "sell"+i,
                sell
            );

        }

    }

}


updatePrices();


/* =====================================================
   استقبال رسالة الأسعار
   ===================================================== */

let lastProcessed = "";


function processMessage(){

    let text =
        document.getElementById(
            "msg"
        ).value;


    if(!text.trim()) return;


    let buys = [

        ...text.matchAll(
            /الشراء\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    let sells = [

        ...text.matchAll(
            /المبيع\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    console.log(
        "عدد أسعار الشراء:",
        buys.length
    );

    console.log(
        "عدد أسعار المبيع:",
        sells.length
    );


    for(
        let i=0;
        i<5;
        i++
    ){

        if(buys[i]){

            let buy =
                buys[i][1];

            localStorage.setItem(
                "buy"+(i+1),
                buy
            );

            console.log(
                "buy"+(i+1),
                buy
            );

        }


        if(sells[i]){

            let sell =
                sells[i][1];

            localStorage.setItem(
                "sell"+(i+1),
                sell
            );

            console.log(
                "sell"+(i+1),
                sell
            );

        }

    }


    updatePrices();


    document.getElementById(
        "msg"
    ).value = "";


    console.log(
        "تم تحديث الأسعار بنجاح"
    );

}


/* =====================================================
   جلب آخر رسالة من Render
   ===================================================== */

async function fetchMessage(){

    try{

        const res =
            await fetch(
                "https://pricing-server-1.onrender.com/msg",
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.text();


        if(
            data.trim() !== "" &&
            data !== lastProcessed
        ){

            const textarea =
                document.getElementById(
                    "msg"
                );


            textarea.value =
                data;


            processMessage();


            lastProcessed =
                data;


            console.log(
                "تم استلام رسالة جديدة من Render"
            );

        }


    }catch(e){

        console.log(
            "Error fetching message:",
            e
        );

    }

}


/* =====================================================
   فحص الأسعار كل ثانية
   ===================================================== */

setInterval(
    fetchMessage,
    1000
);


/* =====================================================
   نظام الأخبار
   ===================================================== */

async function loadNews(){

    try{

        const response =
            await fetch(
                "https://pricing-server-1.onrender.com/news",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "News server error"
            );

        }


        const news =
            await response.json();


        const track =
            document.getElementById(
                "newsTrack"
            );


        if(
            !news ||
            news.length === 0
        ){

            track.textContent =
                "لا توجد أخبار حالياً";

            return;

        }


        track.innerHTML =
            news
            .map(
                function(item){

                    return `
                        <span class="news-item">
                            ${item.title}
                        </span>
                    `;

                }
            )
            .join("");


    }catch(error){

        console.log(
            "News Error:",
            error
        );


        document.getElementById(
            "newsTrack"
        ).textContent =
            "الأخبار غير متاحة حالياً";

    }

}


/* =====================================================
   تحميل الأخبار
   ===================================================== */

loadNews();


/* =====================================================
   تحديث الأخبار كل 5 دقائق
   ===================================================== */

setInterval(
    loadNews,
    5 * 60 * 1000
);


</script>
