<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>لوحة التسعير - الاتحاد</title>

<link rel="icon" type="image/png"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<link rel="apple-touch-icon"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<meta name="theme-color" content="#0b1b3d">
<link rel="manifest" href="./manifest.json">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    direction:rtl;
    color:white;
    background:#0b1b3d;
    overflow:hidden;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:96%;
    height:96%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.header{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:12px;
}

.header img{
    height:90px;
    max-height:15vh;
    width:auto;
    filter:drop-shadow(0 0 20px #f4c430);
}

.header h1{
    font-size:3.5rem;
    color:gold;
    margin:0;
}

.date-time{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-right:15px;
    min-width:180px;
}

.time{
    font-size:2rem;
    font-weight:bold;
    color:gold;
    direction:ltr;
    line-height:1.1;
}

.date{
    font-size:1.1rem;
    color:white;
    font-weight:bold;
    margin-top:5px;
}

.weather{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    margin-top:6px;
    white-space:nowrap;
    direction:rtl;
}

.weather-icon{
    font-size:1.35rem;
    line-height:1;
}

.weather-temp{
    color:gold;
    font-size:1.05rem;
    font-weight:bold;
    direction:ltr;
}

.weather-city{
    color:white;
    font-size:0.85rem;
    font-weight:bold;
}

table{
    width:100%;
    height:auto;
    border-collapse:separate;
    border-spacing:0 6px;
}

th,td{
    padding:10px;
    text-align:center;
    border-radius:12px;
}

th{
    background:linear-gradient(90deg,#1f3c88,#0d6efd);
    color:white;
    font-size:2rem;
}

td{
    background:white;
    color:#0b1b3d;
    font-weight:bold;
}

.price-cell{
    font-size:3rem;
    border:3px solid gold;
    border-radius:12px;
    padding:7px;
    background:white;
    color:#0b1b3d;
}

.gold-price{
    font-size:3rem;
}

.flag-svg{
    width:55px;
    height:32px;
    filter:drop-shadow(0 0 7px rgba(255,255,255,0.35));
}

.gold-icon{
    font-size:2.3rem;
    vertical-align:middle;
}

.up{
    color:#00e676;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:upMove 1s ease-in-out infinite;
}

.down{
    color:#ff3d00;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:downMove 1s ease-in-out infinite;
}

@keyframes upMove{
    0%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
    100%{transform:translateY(0);}
}

@keyframes downMove{
    0%{transform:translateY(0);}
    50%{transform:translateY(5px);}
    100%{transform:translateY(0);}
}

.flash{
    animation:flashAnim 0.4s ease;
}

@keyframes flashAnim{
    0%{background:rgba(255,255,255,0.1);}
    100%{background:transparent;}
}

#updateSystem{
    display:none;
}


/* =====================================================
   🟢 حالة الاتصال
   ===================================================== */

.connection-status{
    position:fixed;
    top:8px;
    left:10px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:4px 8px;
    border-radius:12px;
    background:rgba(0,0,0,0.18);
    font-size:0.70rem;
    color:rgba(255,255,255,0.80);
    z-index:2000;
    direction:rtl;
    transition:all 0.3s ease;
}

.connection-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    display:block;
    transition:all 0.3s ease;
}

.connection-status.online .connection-dot{
    background:#00e676;
    box-shadow:0 0 5px rgba(0,230,118,0.7);
}

.connection-status.offline .connection-dot{
    background:#ff3d00;
    box-shadow:0 0 5px rgba(255,61,0,0.7);
}

.connection-status.online .connection-text::after{
    content:"متصل";
}

.connection-status.offline .connection-text::after{
    content:"غير متصل";
}


/* =====================================================
   👥 الأجهزة المتصلة
   ===================================================== */

.online-devices{
    position:fixed;
    top:8px;
    right:10px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:4px 8px;
    border-radius:12px;
    background:rgba(0,0,0,0.18);
    font-size:0.70rem;
    color:rgba(255,255,255,0.80);
    z-index:2000;
    direction:rtl;
}

.online-devices .online-icon{
    font-size:0.75rem;
}

.online-devices .online-label{
    color:rgba(255,255,255,0.80);
}

.online-devices #onlineCount{
    color:gold;
    font-weight:bold;
}


/* =====================================================
   الأخبار
   ===================================================== */

.news-bar{
    position:fixed;
    bottom:5px;
    left:2%;
    width:96%;
    height:30px;
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.055);
    border:1px solid rgba(244,196,48,0.30);
    border-radius:9px;
    overflow:hidden;
    z-index:1000;
    direction:rtl;
}

.news-title{
    flex:0 0 auto;
    height:100%;
    padding:0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(244,196,48,0.10);
    color:gold;
    font-size:0.85rem;
    font-weight:bold;
}

.news-content{
    flex:1;
    height:100%;
    overflow:hidden;
    position:relative;
    direction:rtl;
    display:flex;
    align-items:center;
    justify-content:center;
}

#newsTrack{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.news-item{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:white;
    font-size:0.85rem;
    font-weight:bold;
    line-height:30px;
    direction:rtl;
    opacity:0;
    position:absolute;
    top:0;
    right:0;
    padding:0 15px;
    transition:opacity 0.8s ease;
}

.news-item.active{
    opacity:1;
}

.news-separator{
    color:gold;
    font-size:0.65rem;
    margin-right:15px;
    margin-left:15px;
}


/* =====================================================
   زر الإشعارات
   ===================================================== */

#notificationButton{
    position:fixed;
    bottom:40px;
    left:8px;
    z-index:3000;
    padding:4px 7px;

    border-radius:12px;
    background:rgba(11,27,61,0.45);
    color:rgba(255,215,0,0.65);
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
    opacity:0.55;
}

}

</style>

<script>


/* =====================================================
   الساعة والتاريخ
   ===================================================== */

function updateDateTime(){

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            'ar-SY',
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit',
                hour12:true
            }
        );

    const date =
        now.toLocaleDateString(
            'ar-SY',
            {
                weekday:'long',
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        );

    document.getElementById("liveTime").textContent =
        time;

    document.getElementById("liveDate").textContent =
        date;

}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);


/* =====================================================
   👥 نظام الأجهزة المتصلة
   ===================================================== */

const ONLINE_SERVER =
    "https://pricing-server-yjam.onrender.com";


function getDeviceId(){

    let deviceId =
        localStorage.getItem(
            "alittihad_device_id"
        );

    if(!deviceId){

        deviceId =
            "device_" +
            Date.now().toString(36) +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,10);

        localStorage.setItem(
            "alittihad_device_id",
            deviceId
        );

    }

    return deviceId;

}


const DEVICE_ID =
    getDeviceId();


async function updateOnlineDevices(){

    try{

        const response =
            await fetch(
                ONLINE_SERVER +
                "/online?id=" +
                encodeURIComponent(
                    DEVICE_ID
                ),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Online server error"
            );

        }

        const data =
            await response.json();

        if(
            data &&
            data.online !== undefined
        ){

            document.getElementById(
                "onlineCount"
            ).textContent =
                data.online;

        }

    }catch(error){

        console.log(
            "Online devices error:",
            error
        );

    }

}


updateOnlineDevices();

setInterval(
    updateOnlineDevices,
    10000
);


/* =====================================================
   🌤️ نظام الطقس
   ===================================================== */

const WEATHER_SERVER =
    "https://pricing-server-yjam.onrender.com";


async function loadWeather(){

    try{

        const response =
            await fetch(
                WEATHER_SERVER +
                "/weather",
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Weather server error"
            );

        }

        const weather =
            await response.json();


        if(
            weather &&
            weather.temperature !== undefined
        ){

            document.getElementById(
                "weatherTemp"
            ).textContent =
                weather.temperature + "°";

        }


        if(
            weather &&
            weather.icon
        ){

            document.getElementById(
                "weatherIcon"
            ).textContent =
                weather.icon;

        }


        if(
            weather &&
            weather.city
        ){

            document.getElementById(
                "weatherCity"
            ).textContent =
                weather.city;

        }

    }catch(error){

        console.log(
            "Weather Error:",
            error
        );

    }

}

loadWeather();

setInterval(
    loadWeather,
    10 * 60 * 1000
);


/* =====================================================
   🔊 نظام الصوت
   ===================================================== */

let audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

let unlocked = false;


document.addEventListener(
    "click",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


document.addEventListener(
    "touchstart",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


function playSound(){

    if(!unlocked) return;

    let o =
        audioCtx.createOscillator();

    let g =
        audioCtx.createGain();

    o.type =
        "sine";

    o.frequency.value =
        880;

    g.gain.value =
        0.15;

    o.connect(g);

    g.connect(
        audioCtx.destination
    );

    o.start();

    o.stop(
        audioCtx.currentTime + 0.12
    );

}


/* =====================================================
   نظام أسعار العملات
   ===================================================== */

let oldPrices = {};

let direction = {};


function updateCell(id,value){

    let el =
        document.getElementById(id);

    if(!el) return;


    if(oldPrices[id] !== undefined){

        if(
            Number(value) !==
            Number(oldPrices[id])
        ){

            if(
                Number(value) >
                Number(oldPrices[id])
            ){

                direction[id] =
                    "up";

            }else{

                direction[id] =
                    "down";

            }


            document.body.classList.add(
                "flash"
            );


            setTimeout(
                function(){

                    document.body.classList.remove(
                        "flash"
                    );

                },
                300
            );


            playSound();

        }

    }


    oldPrices[id] =
        value;


    let arrow = "";


    if(
        direction[id] ===
        "up"
    ){

        arrow =
            "<span class='up'>▲</span>";

    }


    if(
        direction[id] ===
        "down"
    ){

        arrow =
            "<span class='down'>▼</span>";

    }


    el.innerHTML =
        value + arrow;

}


/* =====================================================
   أسعار الذهب
   ===================================================== */

let oldGoldBuy = null;

let oldGoldSell = null;

let goldDirection = "up";


function updateGoldCell(
    id,
    value
){

    const el =
        document.getElementById(
            id
        );

    if(!el) return;


    let oldValue = null;


    if(id === "goldBuy"){

        oldValue =
            oldGoldBuy;

    }else{

        oldValue =
            oldGoldSell;

    }


    if(oldValue !== null){

        if(
            Number(value) !==
            Number(oldValue)
        ){

            if(
                Number(value) >
                Number(oldValue)
            ){

                goldDirection =
                    "up";

            }else{

                goldDirection =
                    "down";

            }


            document.body.classList.add(
                "flash"
            );


            setTimeout(
                function(){

async function loadGold(){

            await fetch(
                ONLINE_SERVER +

                    cache:"no-store"
                }
            );

                "Gold API HTTP " +
                response.status
            );

        const gold =
            await response.json();


        if(
            !gold ||
            gold.symbol !== "XAUUSD"
        ){

            throw new Error(
                "Invalid XAUUSD data"
            );

        }


        if(
            gold.stale === true
        ){

            console.log(
                "⚠️ Gold quote is stale"
            );

            return;

        }


        if(
            gold.bid !== undefined
        ){

            updateGoldCell(
                "goldBuy",
                gold.bid
            );

        }


        if(
            gold.ask !== undefined
        ){

            updateGoldCell(
                "goldSell",
                gold.ask
            );

        }


        if(
            gold.direction ===
            "UP"
        ){

            goldDirection =
                "up";

        }


        if(
            gold.direction ===
            "DOWN"
        ){

            goldDirection =
                "down";

        }


        console.log(
            "🥇 Gold:",
            gold.bid,
            gold.ask,
            gold.direction
        );


    }catch(error){

        console.log(
            "Gold API Error:",
            error
        );

    }

}

/* =====================================================
   استقبال رسالة الأسعار
   ===================================================== */

let lastProcessed = "";


function processMessage(){

    let text =
        document.getElementById(
            "msg"
        ).value;


    if(!text.trim()) return;


    let buys = [
        ...text.matchAll(
            /الشراء\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )
    ];


    let sells = [
        ...text.matchAll(
            /المبيع\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )
    ];


    for(
        let i=0;
        i<5;
        i++
    ){

        if(buys[i]){

            let buy =
                buys[i][1];

            localStorage.setItem(
                "buy"+(i+1),
                buy
            );

        }


        if(sells[i]){

            let sell =
                sells[i][1];

            localStorage.setItem(
                "sell"+(i+1),
                sell
            );

        }

    }


    updatePrices();


    document.getElementById(
        "msg"
    ).value = "";

}


async function fetchMessage(){

    try{

        const res =
            await fetch(
                ONLINE_SERVER +
                "/msg",
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.text();


        if(
            data.trim() !== "" &&
            data !== lastProcessed
        ){

            const textarea =
                document.getElementById(
                    "msg"
                );


            textarea.value =
                data;


            processMessage();


            lastProcessed =
                data;

        }

    }catch(e){

        console.log(
            "Error fetching message:",
            e
        );

    }

}


setInterval(
    fetchMessage,
    1000
);

/* =====================================================
   📰 نظام الأخبار
   ===================================================== */

let newsList = [];

let currentNewsIndex = 0;

let newsTimer = null;

const NEWS_DISPLAY_TIME =
    7000;


async function loadNews(){

    try{

        const response =
            await fetch(
                ONLINE_SERVER +
                "/news",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "News server error"
            );

        }


        const news =
            await response.json();


        if(
            !Array.isArray(news) ||
            news.length === 0
        ){

            newsList = [];

            showNewsMessage(
                "لا توجد أخبار حالياً"
            );

            return;

        }


        newsList =
            news.filter(
                function(item){

                    return (
                        item &&
                        typeof item.title === "string" &&
                        item.title.trim() !== ""
                    );

                }
            );


        if(
            newsList.length === 0
        ){

            showNewsMessage(
                "لا توجد أخبار حالياً"
            );

            return;

        }


        currentNewsIndex = 0;

        startNews();


    }catch(error){

        console.log(
            "News Error:",
            error
        );


        newsList = [];

        showNewsMessage(
            "الأخبار غير متاحة حالياً"
        );

    }

}


function showNewsMessage(
    message
){

    const track =
        document.getElementById(
            "newsTrack"
        );


    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    track.innerHTML = "";


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item";


    item.textContent =
        message;


    track.appendChild(
        item
    );


    void item.offsetWidth;


    item.classList.add(
        "active"
    );


    newsTimer =
        setTimeout(
            function(){

                showNewsMessage(
                    message
                );

            },
            NEWS_DISPLAY_TIME
        );

}


function startNews(){

    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    currentNewsIndex = 0;

    showNextNews();

}


function showNextNews(){

    const track =
        document.getElementById(
            "newsTrack"
        );


    track.innerHTML = "";


    if(
        newsList.length === 0
    ){

        showNewsMessage(
            "لا توجد أخبار حالياً"
        );

        return;

    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item";


    item.textContent =
        newsList[
            currentNewsIndex
        ].title;


    const separator =
        document.createElement(
            "span"
        );


    separator.className =
        "news-separator";


    separator.textContent =
        "◆";


    item.appendChild(
        separator
    );


    track.appendChild(
        item
    );


    void item.offsetWidth;


    item.classList.add(
        "active"
    );


    newsTimer =
        setTimeout(
            function(){

                item.classList.remove(
                    "active"
                );


                setTimeout(
                    function(){

                        currentNewsIndex++;


                        if(
                            currentNewsIndex >=
                            newsList.length
                        ){

                            currentNewsIndex = 0;

                        }


                        showNextNews();

                    },
                    800
                );

            },
            NEWS_DISPLAY_TIME
        );

}


loadNews();


setInterval(
    loadNews,
    5 * 60 * 1000
);


/* =====================================================

const PUSH_SERVER =
    "https://pricing-server-yjam.onrender.com";


function urlBase64ToUint8Array(
    base64String
){

    const padding =
        "=".repeat(
            (
                4 -
                base64String.length % 4
            ) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(
            /-/g,
            "+"
        )
        .replace(
            /_/g,
            "/"
        );


    const rawData =
        window.atob(
            base64
        );


    const outputArray =
        new Uint8Array(
            rawData.length
        );


    for(
        let i=0;
        i<rawData.length;
        ++i
    ){

        outputArray[i] =
            rawData.charCodeAt(i);

    }


    return outputArray;

}


async function enableNotifications(){

    const button =
        document.getElementById(
            "notificationButton"
        );


    try{

        if(
            !("serviceWorker" in navigator) ||
            !("PushManager" in window)
        ){

            throw new Error(
                "المتصفح لا يدعم Push Notifications"
            );

        }


        const registration =
            await navigator.serviceWorker.register(
                "./sw.js",
                {
                    scope:"./"
                }
            );


        await navigator.serviceWorker.ready;


        const permission =
            await Notification.requestPermission();


        if(
            permission !== "granted"
        ){

            throw new Error(
                "لم يتم السماح بالإشعارات"
            );

        }


        const response =
            await fetch(
                PUSH_SERVER +
                "/vapidPublicKey",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "تعذر الاتصال بخادم الإشعارات"
            );

        }


        const data =
            await response.json();


        if(!data.publicKey){

            throw new Error(
                "مفتاح الإشعارات غير موجود في السيرفر"
            );

        }


        let subscription =
            await registration.pushManager.getSubscription();


        if(!subscription){

            subscription =
                await registration.pushManager.subscribe({

                    userVisibleOnly:true,

                    applicationServerKey:
                        urlBase64ToUint8Array(
                            data.publicKey
                        )

                });

        }


        const subscribeResponse =
            await fetch(
                PUSH_SERVER +
                "/subscribe",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            subscription
                        )

                }
            );


        if(!subscribeResponse.ok){

            throw new Error(
                "تعذر تسجيل هذا الجهاز في السيرفر"
            );

        }


        button.style.display =
            "none";


        console.log(
            "تم تفعيل إشعارات الأسعار بنجاح"
        );


    }catch(error){

        console.error(
            "Notification Error:",
            error
        );


        alert(
            "تعذر تفعيل الإشعارات:\n\n" +
            error.message
        );

    }

}


document
    .getElementById(
        "notificationButton"
    )
    .addEventListener(
        "click",
        enableNotifications
    );
