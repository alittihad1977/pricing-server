<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>لوحة التسعير - الاتحاد</title>

<link rel="icon" type="image/png"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<link rel="apple-touch-icon"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<meta name="theme-color" content="#0b1b3d">
<link rel="manifest" href="manifest.json">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    direction:rtl;
    color:white;
    background:#0b1b3d;
    overflow:hidden;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:96%;
    height:96%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.header{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:12px;
}

.header img{
    height:90px;
    max-height:15vh;
    width:auto;
    filter:drop-shadow(0 0 20px #f4c430);
}

.header h1{
    font-size:3.5rem;
    color:gold;
    margin:0;
}


/* =====================================================
   الوقت والتاريخ
   ===================================================== */

.date-time{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-right:15px;
    min-width:180px;
}

.time{
    font-size:2rem;
    font-weight:bold;
    color:gold;
    direction:ltr;
    line-height:1.1;
}

.date{
    font-size:1.1rem;
    color:white;
    font-weight:bold;
    margin-top:5px;
}


/* =====================================================
   جدول الأسعار
   ===================================================== */

table{
    width:100%;
    height:auto;
    border-collapse:separate;
    border-spacing:0 8px;
}

th,td{
    padding:12px;
    text-align:center;
    border-radius:12px;
}

th{
    background:linear-gradient(90deg,#1f3c88,#0d6efd);
    color:white;
    font-size:2rem;
}

td{
    background:white;
    color:#0b1b3d;
    font-weight:bold;
}

.price-cell{
    font-size:3rem;
    border:3px solid gold;
    border-radius:12px;
    padding:8px;
    background:white;
    color:#0b1b3d;
}

.flag-svg{
    width:55px;
    height:32px;
    filter:drop-shadow(0 0 7px rgba(255,255,255,0.35));
}


/* =====================================================
   الأسهم
   ===================================================== */

.up{
    color:#00e676;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:upMove 1s ease-in-out infinite;
}

.down{
    color:#ff3d00;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:downMove 1s ease-in-out infinite;
}

@keyframes upMove{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }
}

@keyframes downMove{
    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(0);
    }
}


/* =====================================================
   وميض تغيير السعر
   ===================================================== */

.flash{
    animation:flashAnim 0.4s ease;
}

@keyframes flashAnim{

    0%{
        background:rgba(255,255,255,0.1);
    }

    100%{
        background:transparent;
    }

}

#updateSystem{
    display:none;
}


/* =====================================================
   مؤشر الاتصال
   ===================================================== */

.connection-status{

    position:fixed;

    top:8px;
    left:10px;

    display:flex;
    align-items:center;

    gap:5px;

    padding:4px 8px;

    border-radius:12px;

    background:rgba(0,0,0,0.18);

    font-size:0.70rem;

    color:rgba(255,255,255,0.80);

    z-index:2000;

    direction:rtl;

    transition:all 0.3s ease;
}

.connection-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    display:block;

    transition:all 0.3s ease;
}

.connection-status.online .connection-dot{

    background:#00e676;

    box-shadow:
        0 0 5px rgba(0,230,118,0.7);
}

.connection-status.offline .connection-dot{

    background:#ff3d00;

    box-shadow:
        0 0 5px rgba(255,61,0,0.7);
}

.connection-status.online .connection-text::after{

    content:"متصل";
}

.connection-status.offline .connection-text::after{

    content:"غير متصل";
}


/* =====================================================
   شريط الأخبار الثابت
   ===================================================== */

.news-bar{

    position:fixed;

    bottom:5px;
    left:2%;

    width:96%;
    height:30px;

    display:flex;
    align-items:center;

    background:rgba(255,255,255,0.055);

    border:1px solid rgba(244,196,48,0.30);

    border-radius:9px;

    overflow:hidden;

    z-index:1000;

    direction:rtl;
}

.news-title{

    flex:0 0 auto;

    height:100%;

    padding:0 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(244,196,48,0.10);

    color:gold;

    font-size:0.85rem;

    font-weight:bold;

    direction:rtl;

    z-index:2;
}

.news-content{

    flex:1;

    height:100%;

    overflow:hidden;

    position:relative;

    direction:rtl;

    display:flex;

    align-items:center;

    justify-content:center;
}

#newsTrack{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;
}

.news-item{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    color:white;

    font-size:0.85rem;

    font-weight:bold;

    line-height:30px;

    direction:rtl;

    opacity:0;

    position:absolute;

    top:0;
    right:0;

    padding:0 15px;

    transition:
        opacity 0.8s ease;
}

.news-item.active{

    opacity:1;
}

.news-separator{

    color:gold;

    font-size:0.65rem;

    margin-right:15px;

    margin-left:15px;

    flex-shrink:0;
}


/* =====================================================
   الشاشات الكبيرة
   ===================================================== */

@media screen and (min-width:1400px){

    .container{
        width:97%;
        height:97%;
    }

    .header{
        margin-bottom:15px;
    }

    .header img{
        height:110px;
    }

    .header h1{
        font-size:4rem;
    }

    .date-time{
        min-width:220px;
    }

    .time{
        font-size:2.5rem;
    }

    .date{
        font-size:1.3rem;
    }

    th{
        font-size:2.4rem;
        padding:16px;
    }

    td{
        padding:14px;
    }

    .price-cell{
        font-size:3.5rem;
        padding:10px;
    }

    .flag-svg{
        width:65px;
        height:38px;
    }

    .news-bar{
        height:34px;
        bottom:7px;
    }

    .news-item{
        font-size:1rem;
        line-height:34px;
    }

    .news-separator{
        font-size:0.7rem;
    }
}


/* =====================================================
   الشاشات الصغيرة
   ===================================================== */

@media screen and (max-width:900px){

    .container{
        width:95%;
    }

    .header img{
        height:70px;
    }

    .header h1{
        font-size:2.5rem;
    }

    .date-time{
        min-width:120px;
        margin-right:5px;
    }

    .time{
        font-size:1.4rem;
    }

    .date{
        font-size:0.8rem;
        margin-top:3px;
    }

    th{
        font-size:1.5rem;
        padding:8px;
    }

    td{
        padding:7px;
    }

    .price-cell{
        font-size:2rem;
        padding:6px;
    }

    .flag-svg{
        width:45px;
        height:27px;
    }

    .up,
    .down{
        font-size:1.8rem;
    }


    /* الاتصال */

    .connection-status{

        top:5px;
        left:6px;

        padding:3px 6px;

        font-size:0.60rem;
    }

    .connection-dot{

        width:6px;
        height:6px;
    }


    /* الأخبار */

    .news-bar{

        bottom:3px;

        left:2.5%;

        width:95%;

        height:25px;
    }

    .news-title{

        padding:0 7px;

        font-size:0.70rem;
    }

    .news-item{

        font-size:0.70rem;

        line-height:25px;

        padding:0 8px;
    }

    .news-separator{

        font-size:0.50rem;

        margin-left:10px;

        margin-right:10px;
    }

}

</style>
</head>

<script>


/* =====================================================
   الساعة والتاريخ
   ===================================================== */

function updateDateTime(){

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            'ar-SY',
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit',
                hour12:false
            }
        );

    const date =
        now.toLocaleDateString(
            'ar-SY',
            {
                weekday:'long',
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        );

    document.getElementById(
        "liveTime"
    ).textContent = time;

    document.getElementById(
        "liveDate"
    ).textContent = date;

}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);


/* =====================================================
   نظام الأسعار
   ===================================================== */

let oldPrices = {};

let direction = {};

let audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

let unlocked = false;


document.addEventListener(
    "click",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


document.addEventListener(
    "touchstart",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


function playSound(){

    if(!unlocked) return;

    let o =
        audioCtx.createOscillator();

    let g =
        audioCtx.createGain();

    o.type = "sine";

    o.frequency.value = 880;

    g.gain.value = 0.15;

    o.connect(g);

    g.connect(
        audioCtx.destination
    );

    o.start();

    o.stop(
        audioCtx.currentTime + 0.12
    );

}


function updateCell(id,value){

    let el =
        document.getElementById(id);

    if(!el) return;


    if(
        oldPrices[id] !== undefined
    ){

        if(
            Number(value) !==
            Number(oldPrices[id])
        ){

            if(
                Number(value) >
                Number(oldPrices[id])
            ){

                direction[id] =
                    "up";

            }else{

                direction[id] =
                    "down";

            }


            document.body.classList.add(
                "flash"
            );


            setTimeout(
                function(){

                    document.body.classList.remove(
                        "flash"
                    );

                },
                300
            );


            playSound();

        }

    }


    oldPrices[id] = value;


    let arrow = "";


    if(
        direction[id] === "up"
    ){

        arrow =
            "<span class='up'>▲</span>";

    }


    if(
        direction[id] === "down"
    ){

        arrow =
            "<span class='down'>▼</span>";

    }


    el.innerHTML =
        value + arrow;

}


function updatePrices(){

    for(
        let i=1;
        i<=5;
        i++
    ){

        let buy =
            localStorage.getItem(
                "buy"+i
            );

        let sell =
            localStorage.getItem(
                "sell"+i
            );


        if(
            buy !== null
        ){

            updateCell(
                "buy"+i,
                buy
            );

        }


        if(
            sell !== null
        ){

            updateCell(
                "sell"+i,
                sell
            );

        }

    }

}


updatePrices();


/* =====================================================
   استقبال رسالة الأسعار
   ===================================================== */

let lastProcessed = "";


function processMessage(){

    let text =
        document.getElementById(
            "msg"
        ).value;


    if(!text.trim()) return;


    let buys = [

        ...text.matchAll(
            /الشراء\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    let sells = [

        ...text.matchAll(
            /المبيع\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    console.log(
        "عدد أسعار الشراء:",
        buys.length
    );

    console.log(
        "عدد أسعار المبيع:",
        sells.length
    );


    for(
        let i=0;
        i<5;
        i++
    ){

        if(
            buys[i]
        ){

            let buy =
                buys[i][1];

            localStorage.setItem(
                "buy"+(i+1),
                buy
            );

        }


        if(
            sells[i]
        ){

            let sell =
                sells[i][1];

            localStorage.setItem(
                "sell"+(i+1),
                sell
            );

        }

    }


    updatePrices();

    document.getElementById(
        "msg"
    ).value = "";

}


async function fetchMessage(){

    try{

        const res =
            await fetch(
                "https://pricing-server-1.onrender.com/msg",
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.text();


        if(
            data.trim() !== "" &&
            data !== lastProcessed
        ){

            const textarea =
                document.getElementById(
                    "msg"
                );

            textarea.value =
                data;

            processMessage();

            lastProcessed =
                data;

        }


    }catch(e){

        console.log(
            "Error fetching message:",
            e
        );

    }

}


setInterval(
    fetchMessage,
    1000
);


/* =====================================================
   حالة الاتصال
   ===================================================== */

function setConnectionStatus(
    online
){

    const status =
        document.getElementById(
            "connectionStatus"
        );


    if(online){

        status.classList.remove(
            "offline"
        );

        status.classList.add(
            "online"
        );

    }else{

        status.classList.remove(
            "online"
        );

        status.classList.add(
            "offline"
        );

    }

}


async function checkConnection(){

    try{

        const response =
            await fetch(
                "https://pricing-server-1.onrender.com/msg",
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        setConnectionStatus(
            response.ok
        );


    }catch(error){

        setConnectionStatus(
            false
        );

    }

}


checkConnection();

setInterval(
    checkConnection,
    5000
);


/* =====================================================
   نظام الأخبار - ثابت بدون حركة
   ===================================================== */

let newsList = [];

let currentNewsIndex = 0;

let newsTimer = null;


/* مدة ظهور الخبر */

const NEWS_DISPLAY_TIME = 7000;


/* تحميل الأخبار */

async function loadNews(){

    try{

        const response =
            await fetch(
                "https://pricing-server-1.onrender.com/news",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "News server error"
            );

        }


        const news =
            await response.json();


        if(
            !Array.isArray(news) ||
            news.length === 0
        ){

            newsList = [];

            showNewsMessage(
                "لا توجد أخبار حالياً"
            );

            return;

        }


        newsList =
            news.filter(
                function(item){

                    return (
                        item &&
                        typeof item.title === "string" &&
                        item.title.trim() !== ""
                    );

                }
            );


        if(
            newsList.length === 0
        ){

            showNewsMessage(
                "لا توجد أخبار حالياً"
            );

            return;

        }


        currentNewsIndex = 0;

        startNews();


    }catch(error){

        console.log(
            "News Error:",
            error
        );


        newsList = [];

        showNewsMessage(
            "الأخبار غير متاحة حالياً"
        );

    }

}


/* =====================================================
   عرض رسالة
   ===================================================== */

function showNewsMessage(
    message
){

    const track =
        document.getElementById(
            "newsTrack"
        );


    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    track.innerHTML = "";


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item";


    item.textContent =
        message;


    track.appendChild(
        item
    );


    void item.offsetWidth;


    item.classList.add(
        "active"
    );


    newsTimer =
        setTimeout(
            function(){

                showNewsMessage(
                    message
                );

            },
            NEWS_DISPLAY_TIME
        );

}


/* =====================================================
   بدء الأخبار
   ===================================================== */

function startNews(){

    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    currentNewsIndex = 0;

    showNextNews();

}


/* =====================================================
   الخبر التالي
   ===================================================== */

function showNextNews(){

    const track =
        document.getElementById(
            "newsTrack"
        );


    track.innerHTML = "";


    if(
        newsList.length === 0
    ){

        showNewsMessage(
            "لا توجد أخبار حالياً"
        );

        return;

    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item";


    /*
       يظهر الخبر ثابتاً
       بدون أي حركة
    */

    item.textContent =
        newsList[
            currentNewsIndex
        ].title;


    /*
       الفاصل الذهبي
    */

    const separator =
        document.createElement(
            "span"
        );


    separator.className =
        "news-separator";


    separator.textContent =
        "◆";


    item.appendChild(
        separator
    );


    track.appendChild(
        item
    );


    /*
       إظهار تدريجي
    */

    void item.offsetWidth;

    item.classList.add(
        "active"
    );


    /*
       الانتقال للخبر التالي
       بعد 7 ثواني
    */

    newsTimer =
        setTimeout(
            function(){

                /*
                   إخفاء الخبر الحالي
                */

                item.classList.remove(
                    "active"
                );


                /*
                   بعد انتهاء تأثير الاختفاء
                   يظهر الخبر التالي
                */

                setTimeout(
                    function(){

                        currentNewsIndex++;

                        if(
                            currentNewsIndex >=
                            newsList.length
                        ){

                            currentNewsIndex = 0;

                        }


                        showNextNews();

                    },
                    800
                );

            },
            NEWS_DISPLAY_TIME
        );

}

loadNews();

setInterval(

    <script>

/* =====================================================
   🔔 نظام إشعارات الأسعار
   ===================================================== */

const PUSH_SERVER =
    "https://pricing-server-1.onrender.com";


/* -----------------------------------------------------
   زر تفعيل الإشعارات
   ----------------------------------------------------- */

function createNotificationButton(){

    if(
        document.getElementById(
            "notificationButton"
        )
    ){

        return;

    }


    const button =
        document.createElement("button");


    button.id =
        "notificationButton";


    button.innerHTML =
        "🔔 تفعيل إشعارات الأسعار";


    button.style.position =
        "fixed";

    button.style.bottom =
        "42px";

    button.style.left =
        "10px";

    button.style.zIndex =
        "3000";

    button.style.padding =
        "6px 10px";

    button.style.border =
        "1px solid rgba(244,196,48,0.45)";

    button.style.borderRadius =
        "14px";

    button.style.background =
        "rgba(11,27,61,0.75)";

    button.style.color =
        "gold";

    button.style.fontSize =
        "11px";

    button.style.fontWeight =
        "bold";

    button.style.cursor =
        "pointer";


    button.onclick =
        enableNotifications;


    document.body.appendChild(
        button
    );

}


/* -----------------------------------------------------
   تسجيل Service Worker
   ----------------------------------------------------- */

async function registerServiceWorker(){

    if(
        !("serviceWorker" in navigator)
    ){

        console.log(
            "Service Worker غير مدعوم"
        );

        return null;

    }


    try{

        const registration =
            await navigator.serviceWorker.register(
                "./sw.js"
            );


        console.log(
            "Service Worker جاهز"
        );


        return registration;


    }catch(error){

        console.error(
            "Service Worker Error:",
            error
        );


        return null;

    }

}


/* -----------------------------------------------------
   جلب المفتاح العام
   ----------------------------------------------------- */

async function getVapidPublicKey(){

    const response =
        await fetch(
            PUSH_SERVER +
            "/vapidPublicKey",
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "تعذر جلب مفتاح الإشعارات"
        );

    }


    const data =
        await response.json();


    if(
        !data.publicKey
    ){

        throw new Error(
            "مفتاح الإشعارات غير موجود"
        );

    }


    return data.publicKey;

}


/* -----------------------------------------------------
   تحويل المفتاح إلى Uint8Array
   ----------------------------------------------------- */

function urlBase64ToUint8Array(
    base64String
){

    const padding =
        "=".repeat(
            (4 -
                base64String.length % 4
            ) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(
            /-/g,
            "+"
        )
        .replace(
            /_/g,
            "/"
        );


    const rawData =
        window.atob(
            base64
        );


    const outputArray =
        new Uint8Array(
            rawData.length
        );


    for(
        let i = 0;
        i < rawData.length;
        ++i
    ){

        outputArray[i] =
            rawData.charCodeAt(i);

    }


    return outputArray;

}


/* -----------------------------------------------------
   تفعيل الإشعارات
   ----------------------------------------------------- */

async function enableNotifications(){

    try{

        if(
            !("Notification" in window)
        ){

            alert(
                "هذا الجهاز لا يدعم الإشعارات."
            );

            return;

        }


        const registration =
            await registerServiceWorker();


        if(!registration){

            alert(
                "تعذر تشغيل نظام الإشعارات."
            );

            return;

        }


        const permission =
            await Notification.requestPermission();


        if(
            permission !== "granted"
        ){

            alert(
                "لم يتم السماح بالإشعارات."
            );

            return;

        }


        const publicKey =
            await getVapidPublicKey();


        let subscription =
            await registration.pushManager.getSubscription();


        if(!subscription){

            subscription =
                await registration.pushManager.subscribe({

                    userVisibleOnly:true,

                    applicationServerKey:
                        urlBase64ToUint8Array(
                            publicKey
                        )

                });

        }


        const response =
            await fetch(
                PUSH_SERVER +
                "/subscribe",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            subscription
                        )

                }
            );


        if(!response.ok){

            throw new Error(
                "تعذر تسجيل الجهاز"
            );

        }


        const button =
            document.getElementById(
                "notificationButton"
            );


        if(button){

            button.innerHTML =
                "🔔 الإشعارات مفعّلة";

            button.style.color =
                "#00e676";

        }


        alert(
            "تم تفعيل إشعارات الأسعار بنجاح 🔔"
        );


    }catch(error){

        console.error(
            "Notification Error:",
            error
        );


        alert(
            "حدث خطأ أثناء تفعيل الإشعارات."
        );

    }

}


/* -----------------------------------------------------
   تشغيل النظام
   ----------------------------------------------------- */

window.addEventListener(
    "load",
    function(){

        createNotificationButton();

    }
);

    </script>
