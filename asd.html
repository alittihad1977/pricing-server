<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<title>لوحة التسعير - الاتحاد</title>

<link rel="icon" type="image/png"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<link rel="apple-touch-icon"
href="https://i.postimg.cc/wvrQMV5X/IMG-20250610-WA0000.png">

<meta name="theme-color" content="#0b1b3d">
<link rel="manifest" href="manifest.json">

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    direction:rtl;
    color:white;
    background:#0b1b3d;
    overflow:hidden;
}

.screen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:96%;
    height:96%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.header{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-bottom:12px;
}

.header img{
    height:90px;
    max-height:15vh;
    width:auto;
    filter:drop-shadow(0 0 20px #f4c430);
}

.header h1{
    font-size:3.5rem;
    color:gold;
    margin:0;
}


/* =====================================================
   الوقت والتاريخ
   ===================================================== */

.date-time{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-right:15px;
    min-width:180px;
}

.time{
    font-size:2rem;
    font-weight:bold;
    color:gold;
    direction:ltr;
    line-height:1.1;
}

.date{
    font-size:1.1rem;
    color:white;
    font-weight:bold;
    margin-top:5px;
}


/* =====================================================
   جدول الأسعار
   ===================================================== */

table{
    width:100%;
    height:auto;
    border-collapse:separate;
    border-spacing:0 8px;
}

th, td{
    padding:12px;
    text-align:center;
    border-radius:12px;
}

th{
    background:linear-gradient(90deg,#1f3c88,#0d6efd);
    color:white;
    font-size:2rem;
}

td{
    background:white;
    color:#0b1b3d;
    font-weight:bold;
}

.price-cell{
    font-size:3rem;
    border:3px solid gold;
    border-radius:12px;
    padding:8px;
    background:white;
    color:#0b1b3d;
}

.flag-svg{
    width:55px;
    height:32px;
    filter:drop-shadow(0 0 7px rgba(255,255,255,0.35));
}


/* =====================================================
   الأسهم
   ===================================================== */

.up{
    color:#00e676;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:upMove 1s ease-in-out infinite;
}

.down{
    color:#ff3d00;
    font-weight:bold;
    font-size:2.5rem;
    margin-left:8px;
    display:inline-block;
    animation:downMove 1s ease-in-out infinite;
}

@keyframes upMove{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }

}

@keyframes downMove{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(0);
    }

}


/* =====================================================
   وميض تغيير السعر
   ===================================================== */

.flash{
    animation:flashAnim 0.4s ease;
}

@keyframes flashAnim{

    0%{
        background:rgba(255,255,255,0.1);
    }

    100%{
        background:transparent;
    }

}

#updateSystem{
    display:none;
}


/* =====================================================
   مؤشر الاتصال
   صغير وناعم
   ===================================================== */

.connection-status{

    position:fixed;

    top:8px;
    left:10px;

    display:flex;
    align-items:center;
    gap:5px;

    padding:4px 8px;

    border-radius:12px;

    background:rgba(0,0,0,0.18);

    font-size:0.70rem;

    color:rgba(255,255,255,0.80);

    z-index:2000;

    direction:rtl;

    transition:all 0.3s ease;

}

.connection-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    display:block;

    transition:all 0.3s ease;

}

.connection-status.online
.connection-dot{

    background:#00e676;

    box-shadow:
        0 0 5px rgba(0,230,118,0.7);

}

.connection-status.offline
.connection-dot{

    background:#ff3d00;

    box-shadow:
        0 0 5px rgba(255,61,0,0.7);

}

.connection-status.online
.connection-text::after{

    content:"متصل";

}

.connection-status.offline
.connection-text::after{

    content:"غير متصل";

}


/* =====================================================
   شريط الأخبار
   ===================================================== */

.news-bar{

    position:fixed;

    bottom:5px;
    left:2%;

    width:96%;
    height:30px;

    display:flex;
    align-items:center;

    background:rgba(255,255,255,0.055);

    border:1px solid rgba(244,196,48,0.30);

    border-radius:9px;

    overflow:hidden;

    z-index:1000;

    direction:ltr;

}

.news-title{

    flex:0 0 auto;

    height:100%;

    padding:0 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(244,196,48,0.10);

    color:gold;

    font-size:0.85rem;

    font-weight:bold;

    direction:rtl;

    z-index:2;

}

.news-content{

    flex:1;

    height:100%;

    overflow:hidden;

    position:relative;

}

.news-item{

    position:absolute;

    top:0;

    right:0;

    height:100%;

    display:flex;

    align-items:center;

    white-space:nowrap;

    color:white;

    font-size:0.85rem;

    font-weight:bold;

    line-height:30px;

    direction:rtl;

    transform:translateX(100%);

    will-change:transform;

}

.news-item.active{

    animation:
        newsSlide
        14s
        linear
        forwards;

}

.news-separator{

    color:gold;

    font-size:0.65rem;

    margin-left:25px;

    margin-right:25px;

}

@keyframes newsSlide{

    from{

        transform:translateX(100%);

    }

    to{

        transform:translateX(
            calc(-100% - 20px)
        );

    }

}


/* =====================================================
   الشاشات الكبيرة
   ===================================================== */

@media screen and (min-width:1400px){

    .container{
        width:97%;
        height:97%;
    }

    .header{
        margin-bottom:15px;
    }

    .header img{
        height:110px;
    }

    .header h1{
        font-size:4rem;
    }

    .date-time{
        min-width:220px;
    }

    .time{
        font-size:2.5rem;
    }

    .date{
        font-size:1.3rem;
    }

    th{
        font-size:2.4rem;
        padding:16px;
    }

    td{
        padding:14px;
    }

    .price-cell{
        font-size:3.5rem;
        padding:10px;
    }

    .flag-svg{
        width:65px;
        height:38px;
    }

    .news-bar{
        height:34px;
        bottom:7px;
    }

    .news-item{
        font-size:1rem;
        line-height:34px;
    }

    .news-separator{
        font-size:0.7rem;
    }

}


/* =====================================================
   الشاشات الصغيرة
   ===================================================== */

@media screen and (max-width:900px){

    .container{
        width:95%;
    }

    .header img{
        height:70px;
    }

    .header h1{
        font-size:2.5rem;
    }

    .date-time{
        min-width:120px;
        margin-right:5px;
    }

    .time{
        font-size:1.4rem;
    }

    .date{
        font-size:0.8rem;
        margin-top:3px;
    }

    th{
        font-size:1.5rem;
        padding:8px;
    }

    td{
        padding:7px;
    }

    .price-cell{
        font-size:2rem;
        padding:6px;
    }

    .flag-svg{
        width:45px;
        height:27px;
    }

    .up,
    .down{
        font-size:1.8rem;
    }


    /* الاتصال */

    .connection-status{

        top:5px;
        left:6px;

        padding:3px 6px;

        font-size:0.60rem;

    }

    .connection-dot{

        width:6px;
        height:6px;

    }


    /* الأخبار */

    .news-bar{

        bottom:3px;

        left:2.5%;

        width:95%;

        height:25px;

    }

    .news-title{

        padding:0 7px;

        font-size:0.70rem;

    }

    .news-item{

        font-size:0.70rem;

        line-height:25px;

    }

    .news-separator{

        font-size:0.50rem;

        margin-left:18px;

        margin-right:18px;

    }

}


/* =====================================================
   نهاية التصميم
   ===================================================== */

</style>
</head>

<script>


/* =====================================================
   الساعة والتاريخ
   ===================================================== */

function updateDateTime(){

    const now = new Date();


    const time =
        now.toLocaleTimeString(
            'ar-SY',
            {
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit',
                hour12:false
            }
        );


    const date =
        now.toLocaleDateString(
            'ar-SY',
            {
                weekday:'long',
                year:'numeric',
                month:'long',
                day:'numeric'
            }
        );


    document.getElementById(
        "liveTime"
    ).textContent = time;


    document.getElementById(
        "liveDate"
    ).textContent = date;

}


updateDateTime();


setInterval(
    updateDateTime,
    1000
);


/* =====================================================
   نظام الأسعار
   ===================================================== */

let oldPrices = {};

let direction = {};


let audioCtx =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


let unlocked = false;


document.addEventListener(
    "click",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


document.addEventListener(
    "touchstart",
    function(){

        audioCtx.resume().then(
            function(){

                unlocked = true;

            }
        );

    },
    {once:true}
);


function playSound(){

    if(!unlocked) return;


    let o =
        audioCtx.createOscillator();


    let g =
        audioCtx.createGain();


    o.type = "sine";


    o.frequency.value = 880;


    g.gain.value = 0.15;


    o.connect(g);


    g.connect(
        audioCtx.destination
    );


    o.start();


    o.stop(
        audioCtx.currentTime + 0.12
    );

}


function updateCell(id,value){

    let el =
        document.getElementById(id);


    if(!el) return;


    if(
        oldPrices[id] !== undefined
    ){

        if(
            Number(value) !==
            Number(oldPrices[id])
        ){

            if(
                Number(value) >
                Number(oldPrices[id])
            ){

                direction[id] =
                    "up";

            }else{

                direction[id] =
                    "down";

            }


            document.body.classList.add(
                "flash"
            );


            setTimeout(
                function(){

                    document.body.classList.remove(
                        "flash"
                    );

                },
                300
            );


            playSound();

        }

    }


    oldPrices[id] = value;


    let arrow = "";


    if(
        direction[id] === "up"
    ){

        arrow =
            "<span class='up'>▲</span>";

    }


    if(
        direction[id] === "down"
    ){

        arrow =
            "<span class='down'>▼</span>";

    }


    el.innerHTML =
        value + arrow;

}


function updatePrices(){

    for(
        let i=1;
        i<=5;
        i++
    ){

        let buy =
            localStorage.getItem(
                "buy"+i
            );


        let sell =
            localStorage.getItem(
                "sell"+i
            );


        if(
            buy !== null
        ){

            updateCell(
                "buy"+i,
                buy
            );

        }


        if(
            sell !== null
        ){

            updateCell(
                "sell"+i,
                sell
            );

        }

    }

}


updatePrices();


/* =====================================================
   استقبال رسالة الأسعار
   ===================================================== */

let lastProcessed = "";


function processMessage(){

    let text =
        document.getElementById(
            "msg"
        ).value;


    if(!text.trim()) return;


    let buys = [

        ...text.matchAll(
            /الشراء\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    let sells = [

        ...text.matchAll(
            /المبيع\s*[:：]\s*([0-9]+(?:\.[0-9]+)?)/g
        )

    ];


    console.log(
        "عدد أسعار الشراء:",
        buys.length
    );


    console.log(
        "عدد أسعار المبيع:",
        sells.length
    );


    for(
        let i=0;
        i<5;
        i++
    ){

        if(
            buys[i]
        ){

            let buy =
                buys[i][1];


            localStorage.setItem(
                "buy"+(i+1),
                buy
            );


            console.log(
                "buy"+(i+1),
                buy
            );

        }


        if(
            sells[i]
        ){

            let sell =
                sells[i][1];


            localStorage.setItem(
                "sell"+(i+1),
                sell
            );


            console.log(
                "sell"+(i+1),
                sell
            );

        }

    }


    updatePrices();


    document.getElementById(
        "msg"
    ).value = "";


    console.log(
        "تم تحديث الأسعار بنجاح"
    );

}


/* =====================================================
   جلب آخر رسالة من Render
   ===================================================== */

async function fetchMessage(){

    try{

        const res =
            await fetch(
                "https://pricing-server-1.onrender.com/msg",
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.text();


        if(
            data.trim() !== "" &&
            data !== lastProcessed
        ){

            const textarea =
                document.getElementById(
                    "msg"
                );


            textarea.value =
                data;


            processMessage();


            lastProcessed =
                data;


            console.log(
                "تم استلام رسالة جديدة من Render"
            );

        }


    }catch(e){

        console.log(
            "Error fetching message:",
            e
        );

    }

}


/* =====================================================
   فحص الأسعار كل ثانية
   ===================================================== */

setInterval(
    fetchMessage,
    1000
);


/* =====================================================
   حالة الاتصال
   ===================================================== */

function setConnectionStatus(
    online
){

    const status =
        document.getElementById(
            "connectionStatus"
        );


    if(online){

        status.classList.remove(
            "offline"
        );

        status.classList.add(
            "online"
        );

    }else{

        status.classList.remove(
            "online"
        );

        status.classList.add(
            "offline"
        );

    }

}


async function checkConnection(){

    try{

        const response =
            await fetch(
                "https://pricing-server-1.onrender.com/msg",
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(
            response.ok
        ){

            setConnectionStatus(
                true
            );

        }else{

            setConnectionStatus(
                false
            );

        }


    }catch(error){

        setConnectionStatus(
            false
        );

    }

}


/* الفحص الأول */

checkConnection();


/* فحص الاتصال كل 5 ثوانٍ */

setInterval(
    checkConnection,
    5000
);


/* =====================================================
   نظام الأخبار
   ===================================================== */

let newsList = [];

let currentNewsIndex = 0;

let newsTimer = null;


async function loadNews(){

    try{

        const response =
            await fetch(
                "https://pricing-server-1.onrender.com/news",
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "News server error"
            );

        }


        const news =
            await response.json();


        if(
            !Array.isArray(news) ||
            news.length === 0
        ){

            newsList = [];

            showNewsMessage(
                "لا توجد أخبار حالياً"
            );

            return;

        }


        newsList =
            news.filter(
                function(item){

                    return (
                        item &&
                        item.title &&
                        item.title.trim()
                    );

                }
            );


        currentNewsIndex = 0;


        startNews();


    }catch(error){

        console.log(
            "News Error:",
            error
        );


        newsList = [];


        showNewsMessage(
            "الأخبار غير متاحة حالياً"
        );

    }

}


/* =====================================================
   عرض رسالة داخل شريط الأخبار
   ===================================================== */

function showNewsMessage(
    message
){

    const track =
        document.getElementById(
            "newsTrack"
        );


    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    track.innerHTML = "";


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item active";


    item.textContent =
        message;


    track.appendChild(
        item
    );

}


/* =====================================================
   تشغيل الأخبار خبر بخبر
   ===================================================== */

function startNews(){

    const track =
        document.getElementById(
            "newsTrack"
        );


    if(newsTimer){

        clearTimeout(
            newsTimer
        );

    }


    track.innerHTML = "";


    if(
        !newsList.length
    ){

        showNewsMessage(
            "لا توجد أخبار حالياً"
        );

        return;

    }


    showNextNews();

}


/* =====================================================
   الخبر التالي
   ===================================================== */

function showNextNews(){

    const track =
        document.getElementById(
            "newsTrack"
        );


    track.innerHTML = "";


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "news-item";


    item.innerHTML =
        newsList[currentNewsIndex].title;


    const separator =
        document.createElement(
            "span"
        );


    separator.className =
        "news-separator";


    separator.textContent =
        "◆";


    item.appendChild(
        separator
    );


    track.appendChild(
        item
    );


    /*
       إجبار المتصفح على تسجيل
       الوضع الابتدائي قبل تشغيل الحركة
    */

    void item.offsetWidth;


    item.classList.add(
        "active"
    );


    currentNewsIndex++;


    if(
        currentNewsIndex >=
        newsList.length
    ){

        currentNewsIndex = 0;

    }


    /*
       كل خبر يأخذ 14 ثانية
       ثم ينتقل للخبر التالي
    */

    newsTimer =
        setTimeout(
            showNextNews,
            14000
        );

}


/* =====================================================
   تحميل الأخبار أول مرة
   ===================================================== */

loadNews();


/* =====================================================
   تحديث الأخبار كل 5 دقائق
   ===================================================== */

setInterval(
    loadNews,
    5 * 60 * 1000
);


</script>
