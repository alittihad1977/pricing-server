<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة أخبار شركة الاتحاد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1b3d;color:#fff;font-family:Arial,sans-serif;padding:24px}
.wrap{max-width:900px;margin:auto}
h1{color:#f4c430;text-align:center;margin:0 0 20px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(244,196,48,.35);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;margin:10px 0 6px;font-weight:bold}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:11px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:#fff;color:#0b1b3d}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:bold}
.primary{background:#f4c430;color:#0b1b3d}
.danger{background:#ff3d00;color:#fff}
.secondary{background:#1f3c88;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status{padding:10px;border-radius:9px;background:rgba(255,255,255,.08);margin-bottom:14px}
.news{border:1px solid rgba(244,196,48,.25);border-radius:12px;padding:14px;margin-top:12px}
.news h3{margin:0 0 8px;color:#f4c430}
.meta{font-size:.85rem;opacity:.8;margin-top:8px;line-height:1.7}
.hidden{display:none}
.image-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.image-card{border:1px solid rgba(244,196,48,.3);border-radius:12px;padding:10px;min-width:0}
.image-card img{width:100%;height:180px;object-fit:contain;background:#07132b;border-radius:8px}
.image-name{font-size:.85rem;overflow-wrap:anywhere;margin:8px 0;line-height:1.5}
.image-card .row{margin-top:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📢 إدارة أخبار شركة الاتحاد</h1>

<div class="card" id="loginCard">
<label>كلمة مرور الإدارة</label>
<input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
<div class="row"><button class="primary" onclick="login()">دخول</button></div>
</div>

<div id="app" class="hidden">
<div id="status" class="status">جاهز</div>

<div class="card">
<h2 id="formTitle">إضافة خبر جديد</h2>
<input id="editId" type="hidden">
<label>عنوان الخبر *</label>
<input id="title" maxlength="180" placeholder="مثال: تنويه هام لعملاء شركة الاتحاد">
<label>نص الخبر</label>
<textarea id="body" maxlength="600" placeholder="تفاصيل الخبر إن وجدت..."></textarea>
<div class="grid">
<div><label>يبدأ الظهور</label><input id="startAt" type="datetime-local"></div>
<div><label>ينتهي الظهور</label><input id="endAt" type="datetime-local"></div>
</div>
<div class="grid">
<div><label>الترتيب</label><input id="order" type="number" value="1" min="0"></div>
<div><label>الحالة</label><div class="row"><label style="display:flex;align-items:center;gap:8px"><input id="enabled" type="checkbox" checked style="width:auto"> نشر الخبر</label></div></div>
</div>
<div class="row">
<button class="primary" onclick="saveNews()">حفظ الخبر</button>
<button class="secondary" onclick="clearForm()">تفريغ</button>
</div>
</div>


<div class="card" id="imagesCard">
<h2>🖼️🎬 إدارة الصور والفيديوهات للوحة التسعير</h2>
<p>ارفع صوراً أو فيديوهات من الهاتف. تظهر الصور 12 ثانية، أما الفيديو فيُعرض كاملاً حتى نهايته ثم تعود لوحة التسعير.</p>
<label>اختيار الصور والفيديوهات</label>
<input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/ogg,video/quicktime" multiple>
<div class="row"><button class="primary" onclick="uploadImages()">رفع الملفات المختارة</button><button class="secondary" onclick="refreshImages()">تحديث الملفات</button></div>
<div id="imageList" class="image-grid"><p>جاري تحميل الصور والفيديوهات...</p></div>
</div>

<div class="card">
<h2>الأخبار الحالية</h2>
<div id="list">جاري التحميل...</div>
</div>
</div>
</div>
<script>
const SERVER='https://pricing-server-yjam.onrender.com';
let password='';

function setStatus(text){document.getElementById('status').textContent=text;}
function isoToLocal(value){
    if(!value) return '';
    const d=new Date(value); if(Number.isNaN(d.getTime())) return '';
    const pad=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function localToIso(value){return value ? new Date(value).toISOString() : '';}

async function api(path, payload){
    const response=await fetch(SERVER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'تعذر تنفيذ العملية');
    return data;
}

async function login(){
    const value=document.getElementById('password').value;
    if(!value){alert('أدخل كلمة المرور');return;}
    try{
        const data=await api('/company-news/admin-list',{password:value});
        password=value;
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        renderList(data.items||[]);
        await refreshImages();
        setStatus('تم الدخول بنجاح');
    }catch(error){alert('فشل الدخول: '+error.message);}
}

async function refresh(){
    try{
        const data=await api('/company-news/admin-list',{password});
        renderList(data.items||[]);
        await refreshImages();
        setStatus('تم تحديث القائمة');
    }catch(error){setStatus('خطأ: '+error.message);}
}

function renderList(items){
    const list=document.getElementById('list');
    if(!items.length){list.innerHTML='<p>لا توجد أخبار محفوظة.</p>';return;}
    list.innerHTML='';
    items.forEach(item=>{
        const el=document.createElement('div'); el.className='news';
        const title=document.createElement('h3'); title.textContent=item.title;
        const body=document.createElement('div'); body.textContent=item.body||'';
        const meta=document.createElement('div'); meta.className='meta';
        const start=item.startAt?new Date(item.startAt).toLocaleString('ar-SY'):'فوراً';
        const end=item.endAt?new Date(item.endAt).toLocaleString('ar-SY'):'بدون انتهاء';
        meta.textContent='الحالة: '+(item.enabled===false?'مخفي':'مفعّل')+' | يبدأ: '+start+' | ينتهي: '+end+' | الترتيب: '+(item.order??999);
        const row=document.createElement('div'); row.className='row';
        const edit=document.createElement('button'); edit.className='secondary'; edit.textContent='تعديل'; edit.onclick=()=>editNews(item);
        const del=document.createElement('button'); del.className='danger'; del.textContent='حذف'; del.onclick=()=>deleteNews(item.id);
        row.append(edit,del); el.append(title,body,meta,row); list.appendChild(el);
    });
}

function editNews(item){
    document.getElementById('formTitle').textContent='تعديل الخبر';
    document.getElementById('editId').value=item.id;
    document.getElementById('title').value=item.title||'';
    document.getElementById('body').value=item.body||'';
    document.getElementById('startAt').value=isoToLocal(item.startAt);
    document.getElementById('endAt').value=isoToLocal(item.endAt);
    document.getElementById('order').value=item.order??999;
    document.getElementById('enabled').checked=item.enabled!==false;
    window.scrollTo({top:0,behavior:'smooth'});
}

function clearForm(){
    document.getElementById('formTitle').textContent='إضافة خبر جديد';
    document.getElementById('editId').value='';
    document.getElementById('title').value='';
    document.getElementById('body').value='';
    document.getElementById('startAt').value='';
    document.getElementById('endAt').value='';
    document.getElementById('order').value='1';
    document.getElementById('enabled').checked=true;
}

async function saveNews(){
    const title=document.getElementById('title').value.trim();
    if(!title){alert('عنوان الخبر مطلوب');return;}
    const payload={
        password,
        id:document.getElementById('editId').value,
        title,
        body:document.getElementById('body').value.trim(),
        startAt:localToIso(document.getElementById('startAt').value),
        endAt:localToIso(document.getElementById('endAt').value),
        order:Number(document.getElementById('order').value||999),
        enabled:document.getElementById('enabled').checked
    };
    try{
        const path=payload.id?'/company-news/update':'/company-news/create';
        await api(path,payload);
        clearForm();
        await refresh();
        alert('تم حفظ الخبر بنجاح');
    }catch(error){alert('تعذر حفظ الخبر: '+error.message);}
}

async function deleteNews(id){
    if(!confirm('متأكد من حذف الخبر؟')) return;
    try{
        await api('/company-news/delete',{password,id});
        await refresh();
        alert('تم حذف الخبر');
    }catch(error){alert('تعذر الحذف: '+error.message);}
}


async function refreshImages(){
    try{
        const data=await api('/company-images/admin-list',{password});
        renderImages(data.items||[]);
    }catch(error){
        const list=document.getElementById('imageList');
        if(list) list.textContent='تعذر تحميل الصور: '+error.message;
    }
}

function renderImages(items){
    const list=document.getElementById('imageList');
    if(!list) return;
    list.innerHTML='';
    if(!items.length){list.textContent='لا توجد صور أو فيديوهات مرفوعة حالياً.';return;}
    items.forEach(item=>{
        const card=document.createElement('div');card.className='image-card';
        let preview;
        if(item.type==='video'||String(item.mime||'').startsWith('video/')){
            preview=document.createElement('video');preview.src=item.url;preview.controls=true;preview.preload='metadata';preview.playsInline=true;
            preview.style.width='100%';preview.style.height='180px';preview.style.objectFit='contain';preview.style.background='#07132b';preview.style.borderRadius='8px';
        }else{
            preview=document.createElement('img');preview.src=item.url;preview.alt=item.name||'صورة الشركة';preview.loading='lazy';
        }
        const name=document.createElement('div');name.className='image-name';name.textContent=(item.type==='video'?'🎬 ':'🖼️ ')+(item.name||'ملف');
        const row=document.createElement('div');row.className='row';
        const del=document.createElement('button');del.className='danger';del.textContent='حذف الملف';del.onclick=()=>deleteImage(item.id);
        row.appendChild(del);card.append(preview,name,row);list.appendChild(card);
    });
}

function readFileAsDataUrl(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(new Error('تعذر قراءة الصورة '+file.name));
        reader.readAsDataURL(file);
    });
}

async function uploadImages(){
    const input=document.getElementById('imageFiles');
    const files=Array.from(input.files||[]);
    if(!files.length){alert('اختر صورة أو فيديو واحداً على الأقل');return;}
    try{
        for(let i=0;i<files.length;i++){
            const file=files[i];
            const isVideo=file.type.startsWith('video/');
            setStatus('جارٍ رفع '+(isVideo?'الفيديو':'الصورة')+' '+(i+1)+' من '+files.length+': '+file.name);
            const dataUrl=await readFileAsDataUrl(file);
            const payload={password,name:file.name};
            payload[isVideo?'videoData':'imageData']=dataUrl;
            await api('/company-images/upload',payload);
        }
        input.value='';
        await refreshImages();
        setStatus('تم رفع الملفات بنجاح');
        alert('تم رفع الملفات بنجاح، وستظهر تلقائياً على لوحة التسعير.');
    }catch(error){
        setStatus('تعذر رفع الملف');
        alert('تعذر رفع الملف: '+error.message);
    }
}

async function deleteImage(id){
    if(!confirm('متأكد من حذف هذه الصورة من لوحة التسعير؟')) return;
    try{
        await api('/company-images/delete',{password,id});
        await refreshImages();
        setStatus('تم حذف الصورة');
    }catch(error){alert('تعذر حذف الصورة: '+error.message);}
}

document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
